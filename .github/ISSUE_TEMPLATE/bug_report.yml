name: Bug report
description: Segnala un difetto riproducibile
title: "fix: "
labels: ["type:fix"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Descrizione del problema
      description: Che cosa non funziona?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Passi per riprodurlo
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Risultato atteso
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Risultato osservato
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Ambiente e prove
      description: Commit/branch, log pertinenti ripuliti da segreti, test falliti e screenshot se utili.
    validations:
      required: false
